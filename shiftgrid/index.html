<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftGrid - Quick Shift Planner</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #1e293b; max-width: 600px; margin: 40px auto; padding: 24px; background: #0b1c30; text-align: center; }
        .card { background: #132845; padding: 40px 24px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); border: 1px solid #1e3a5f; color: #f8fafc; }
        img.icon { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 8px 16px rgba(0,0,0,0.25); margin-bottom: 20px; }
        h1 { margin: 0 0 8px 0; font-size: 28px; color: #f8fafc; }
        p.subtitle { color: #94a3b8; font-size: 16px; margin-top: 0; margin-bottom: 28px; }
        .links { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto; }
        a.btn { display: block; padding: 14px 20px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 15px; transition: background 0.2s; }
        a.btn:hover { background: #1d4ed8; }
        a.btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
        a.btn-secondary:hover { background: #334155; }
        footer { margin-top: 36px; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <img src="icon.png" alt="ShiftGrid Icon" class="icon">
        <h1>ShiftGrid</h1>
        <p class="subtitle">The Fast, Private Shift & Duty Calendar for Professionals</p>
        <div class="links">
            <a href="privacy.html" class="btn">Privacy Policy</a>
            <a href="terms.html" class="btn btn-secondary">Terms of Service</a>
        </div>
        <footer>
            &copy; 2026 ShiftGrid. All rights reserved.
        </footer>
    </div>
</body>
</html>
